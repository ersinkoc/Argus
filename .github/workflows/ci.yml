name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./...

      - name: Compile tests
        run: make test-compile

      - name: Test
        run: make test-timing

      - name: Upload test timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing
          path: test-timing.jsonl
          if-no-files-found: warn

      - name: Race smoke
        run: make test-race

      - name: Vet
        run: go vet ./...

      - name: Benchmark
        run: go test ./internal/inspection/ ./internal/masking/ ./internal/policy/ ./internal/ratelimit/ ./internal/metrics/ -bench=. -benchmem -count=1 -timeout 60s

  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go formatting
        env:
          GOFMT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$GOFMT_BASE_REF" || true
          make fmt-check

      - name: Coverage
        run: make coverage-ci

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: warn

      - name: Install YAML and shell linters
        run: |
          python3 -m pip install --user PyYAML
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: YAML validation
        run: |
          python3 - <<'PY'
          import pathlib
          import yaml

          for path in sorted(pathlib.Path('.').rglob('*')):
              if path.parts[0] in {'.git', '.wrongstack'}:
                  continue
              if path.suffix not in {'.yml', '.yaml'}:
                  continue
              with path.open(encoding='utf-8') as handle:
                  list(yaml.safe_load_all(handle))
              print(f'validated {path}')
          PY

      - name: Shell scripts
        run: shellcheck setup.sh scripts/*.sh

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.24'
          go-package: ./...

      - name: Docker image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [test, quality]
    timeout-minutes: 20
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY=argus-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          go build -ldflags "-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" \
            -o "$BINARY" ./cmd/argus/
          ls -lh "$BINARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.goos }}-${{ matrix.goarch }}
          path: argus-*

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, quality]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t argus:test .

      - name: Check image size
        run: docker images argus:test --format "{{.Size}}"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test, quality]
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: argus_pass
          POSTGRES_USER: argus_test
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      mysql:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: root_pass
          MYSQL_DATABASE: argus_test
          MYSQL_USER: argus_test
          MYSQL_PASSWORD: argus_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ArgusPass123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "sqlcmd -S localhost -U sa -P 'ArgusPass123!' -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Argus
        run: go build -o argus ./cmd/argus/

      - name: Create config for CI
        run: |
          cat > argus-e2e-ci.json << 'EOF'
          {
            "server": {
              "listeners": [
                {"address": ":30100", "protocol": "postgresql"},
                {"address": ":30101", "protocol": "mysql"},
                {"address": ":30102", "protocol": "mssql"}
              ]
            },
            "targets": [
              {"name": "postgres", "protocol": "postgresql", "host": "127.0.0.1", "port": 5432},
              {"name": "mysql", "protocol": "mysql", "host": "127.0.0.1", "port": 3306},
              {"name": "mssql", "protocol": "mssql", "host": "127.0.0.1", "port": 1433, "tls": {"enabled": false}}
            ],
            "routing": {"default_target": "postgres"},
            "policy": {"files": ["configs/policies/default.json"], "reload_interval": "5s"},
            "pool": {"max_connections_per_target": 5, "min_idle_connections": 1, "connection_timeout": "5s"},
            "session": {"idle_timeout": "10m", "max_duration": "1h"},
            "audit": {"level": "verbose", "outputs": [{"type": "stdout"}], "buffer_size": 100},
            "admin": {"enabled": true, "address": ":9091"},
            "metrics": {"enabled": true, "address": ":9090"}
          }
          EOF

      - name: Start Argus
        run: ./argus -config argus-e2e-ci.json &
        env:
          ARGUS_ROUTING_DEFAULT_TARGET: postgres

      - name: Wait for Argus
        run: sleep 5

      - name: Health check
        run: curl -sf http://localhost:9091/healthz || echo "health check failed"

      - name: Run basic E2E
        run: |
          set +e
          FAIL_COUNT=0
          # Admin API tests
          curl -sf http://localhost:9091/healthz || FAIL_COUNT=$((FAIL_COUNT+1))
          curl -sf http://localhost:9091/livez || FAIL_COUNT=$((FAIL_COUNT+1))
          curl -sf http://localhost:9091/ready || FAIL_COUNT=$((FAIL_COUNT+1))
          curl -sf http://localhost:9091/metrics | grep -q "argus_" || FAIL_COUNT=$((FAIL_COUNT+1))
          curl -sf http://localhost:9091/api/stats || FAIL_COUNT=$((FAIL_COUNT+1))
          curl -sf http://localhost:9091/api/pool/health || FAIL_COUNT=$((FAIL_COUNT+1))
          # Gateway tests
          curl -sf http://localhost:9091/api/gateway/status?approval_id=test || FAIL_COUNT=$((FAIL_COUNT+1))
          # Policy tests
          curl -sf http://localhost:9091/api/policies/validate || FAIL_COUNT=$((FAIL_COUNT+1))
          if [ $FAIL_COUNT -gt 0 ]; then
            echo "E2E FAILED: $FAIL_COUNT checks"
            exit 1
          fi
          echo "E2E PASSED: all basic checks"

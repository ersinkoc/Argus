# Standalone Argus Proxy Gateway
# Run: docker compose -f docker-compose.gateway.yml up -d
#
# This mode runs Argus as a standalone proxy gateway without bundled databases.
# Point it to your existing database backends via environment variables.
#
# Services:
#   argus-proxy    → Argus gateway (proxy + admin API + dashboard)
#
# Exposed ports:
#   15432  → PostgreSQL proxy
#   13306  → MySQL proxy
#   11433  → MSSQL proxy
#   9090   → Admin API + Dashboard + Metrics / Health

services:
  argus-proxy:
    image: argus:latest
    build:
      context: .
      args:
        VERSION: "v1.0.0"
    ports:
      - "15432:15432"   # PostgreSQL proxy
      - "13306:13306"   # MySQL proxy
      - "11433:11433"   # MSSQL proxy
      - "9090:9090"     # Admin API + Dashboard UI + Metrics / Health
    environment:
      # Database backends — point to your existing databases
      DB_PG_HOST: "${DB_PG_HOST:-host.docker.internal}"
      DB_PG_PORT: "${DB_PG_PORT:-5432}"
      DB_MYSQL_HOST: "${DB_MYSQL_HOST:-host.docker.internal}"
      DB_MYSQL_PORT: "${DB_MYSQL_PORT:-3306}"
      DB_MSSQL_HOST: "${DB_MSSQL_HOST:-host.docker.internal}"
      DB_MSSQL_PORT: "${DB_MSSQL_PORT:-1433}"

      # Admin & Gateway security tokens
      ARGUS_ADMIN_TOKEN: "${ARGUS_ADMIN_TOKEN:-changeme-admin-token-32chars!}"
      ARGUS_GATEWAY_API_KEY: "${ARGUS_GATEWAY_API_KEY:-gw-key-argus-2024}"

      # Optional SIEM webhook
      ARGUS_WEBHOOK_URL: "${ARGUS_WEBHOOK_URL:-}"

      # Logging
      ARGUS_AUDIT_LEVEL: "${ARGUS_AUDIT_LEVEL:-verbose}"
    volumes:
      - argus_logs:/var/log/argus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/livez"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  argus_logs:

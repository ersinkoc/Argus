## kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argus

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

## Image tag. Override per environment — in production, pin to an immutable digest:
##   images:
##     - name: ghcr.io/ersinkoc/argus
##       digest: sha256:abc123...
images:
  - name: ghcr.io/ersinkoc/argus
    newTag: v0.1.0

## Override for a specific environment:
## kustomize build k8s/ | kubectl apply -f -
## or:
## kubectl apply -k k8s/
